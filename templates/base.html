<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}将軍パネル{% endblock %}</title>
    <!-- htmx 2.x Core -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.0/dist/htmx.min.js"></script>
    <!-- htmx WebSocket Extension -->
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-ws@2.0.0/dist/ws.js"></script>
    <!-- xterm.js: Terminal emulator with image protocol support (local, no CDN dependency) -->
    <link rel="stylesheet" href="{{ base_path }}/static/vendor/xterm.css">
    <script src="{{ base_path }}/static/vendor/xterm.js"></script>
    <script src="{{ base_path }}/static/vendor/addon-image.js"></script>
    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Light theme for markdown (sengoku washi background) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    <link rel="stylesheet" href="{{ base_path }}/static/style.css?v=20260221">
    <style>
    .bakuhu-role-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 14px;
        font-size: 12px;
        font-weight: bold;
        border: 1.5px solid;
        white-space: nowrap;
    }
    .bakuhu-role-badge.primary {
        background: rgba(255, 215, 60, 0.85);
        border-color: rgba(140, 100, 0, 0.8);
        color: #3a1800;
    }
    .bakuhu-role-badge.secondary {
        background: rgba(80, 130, 220, 0.85);
        border-color: rgba(40, 80, 180, 0.8);
        color: #fff;
    }
    </style>
</head>
<body>
    <header>
        <h1>🏯 将軍パネル - Shogun Web Panel</h1>
        <span class="bakuhu-role-badge {{ bakuhu_role }}">🏯 {% if bakuhu_role == 'primary' %}主幕府{% else %}従幕府{% endif %}</span>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>multi-agent-bakuhu v2.2</p>
    </footer>
</body>
</html>
