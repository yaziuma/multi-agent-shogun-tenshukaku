{% extends "base.html" %}

{% block content %}
<div class="container">
    <!-- タブナビゲーション -->
    <nav class="tab-nav">
        <button type="button" class="tab-btn active" data-tab="command" hx-disable>指揮</button>
        <button type="button" class="tab-btn" data-tab="monitor" hx-disable>監視</button>
        <button type="button" class="tab-btn" data-tab="dashboard" hx-disable>戦況</button>
        <button type="button" class="tab-btn" data-tab="history" hx-disable>履歴</button>
    </nav>

    <!-- タブ1: 指揮 -->
    <div class="tab-content active" id="tab-command">
        <section class="command-input">
            <h2>💬 将軍との会話</h2>
            <form hx-post="{{ base_path }}/api/command" hx-target="#command-result" hx-swap="innerHTML"
                  hx-on::after-request="if(event.detail.successful) { this.reset(); onCommandSuccess(); }">
                <div style="display:flex; gap:6px; align-items:stretch;">
                    <textarea name="instruction" rows="5" placeholder="将軍に話しかける..." style="flex:1;"></textarea>
                    <button type="button" id="file-attach-btn" title="ファイルを添付（PDF・画像・テキスト等）"
                            style="background:#fff8ee; border:2px solid #7a4419; border-radius:4px; cursor:pointer; font-size:20px; color:#7a4419; padding:0 12px; flex-shrink:0; line-height:1;">📎</button>
                </div>
                <!-- 添付ファイルリスト -->
                <div id="file-chips-container" style="display:none; margin-top:4px; flex-wrap:wrap; gap:4px;"></div>
                <div id="file-drop-overlay" style="display:none; border: 2px dashed #888; border-radius: 6px; padding: 10px 16px; color: #999; font-size: 13px; text-align: center; margin-top: 8px;">
                    📎 ここにドロップして将軍に送る
                </div>
                <div class="btn-row">
                    <button type="submit">送信</button>
                    <button type="button" id="esc-btn" class="esc-btn">Esc</button>
                </div>
            </form>
            <div id="file-paste-status" style="display:none; margin-top:6px; font-size:13px; padding: 6px 10px; border-radius: 4px;"></div>
            <div id="command-result"></div>
        </section>

        <!-- TUI操作パネル -->
        <section class="tui-panel">
            <h2 class="tui-panel-toggle" id="tui-panel-toggle">
                <span id="tui-toggle-icon">▶</span> 🎮 TUI操作パネル
            </h2>
            <div class="tui-grid" id="tui-grid" style="display: none;">
                <!-- 方向キー -->
                <div class="tui-group">
                    <h3>方向キー</h3>
                    <div class="arrow-grid">
                        <button type="button" class="tui-key arrow-key" data-key="Up">↑</button>
                        <button type="button" class="tui-key arrow-key" data-key="Down">↓</button>
                        <button type="button" class="tui-key arrow-key" data-key="Left">←</button>
                        <button type="button" class="tui-key arrow-key" data-key="Right">→</button>
                    </div>
                </div>

                <!-- 操作ボタン -->
                <div class="tui-group">
                    <h3>操作</h3>
                    <div class="tui-buttons">
                        <button type="button" class="tui-key tui-key-critical" data-key="Enter">
                            <span class="btn-text">Enter</span>
                            <span class="progress-bar"></span>
                        </button>
                        <button type="button" class="tui-key tui-key-critical" data-key="Escape">
                            <span class="btn-text">Esc</span>
                            <span class="progress-bar"></span>
                        </button>
                        <button type="button" class="tui-key" data-key="Tab">Tab</button>
                        <button type="button" class="tui-key" data-key="BTab">Shift+Tab</button>
                        <button type="button" class="tui-key" data-key="Space">Space</button>
                        <button type="button" class="tui-key" data-key="BSpace">⌫ Back</button>
                    </div>
                </div>

                <!-- 数字キー -->
                <div class="tui-group">
                    <h3>数字</h3>
                    <div class="number-grid">
                        <button type="button" class="tui-key number-key" data-key="1">1</button>
                        <button type="button" class="tui-key number-key" data-key="2">2</button>
                        <button type="button" class="tui-key number-key" data-key="3">3</button>
                        <button type="button" class="tui-key number-key" data-key="4">4</button>
                        <button type="button" class="tui-key number-key" data-key="5">5</button>
                        <button type="button" class="tui-key number-key" data-key="6">6</button>
                        <button type="button" class="tui-key number-key" data-key="7">7</button>
                        <button type="button" class="tui-key number-key" data-key="8">8</button>
                        <button type="button" class="tui-key number-key" data-key="9">9</button>
                        <button type="button" class="tui-key number-key" data-key="0">0</button>
                    </div>
                </div>

                <!-- Yes/No -->
                <div class="tui-group">
                    <h3>確認</h3>
                    <div class="tui-buttons">
                        <button type="button" class="tui-key yn-key tui-key-critical" data-key="y">
                            <span class="btn-text">✓ Yes (y)</span>
                            <span class="progress-bar"></span>
                        </button>
                        <button type="button" class="tui-key yn-key tui-key-critical" data-key="n">
                            <span class="btn-text">✗ No (n)</span>
                            <span class="progress-bar"></span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="chat-log-section">
            <h2>📝 会話ログ</h2>
            <div id="chat-log"></div>
        </section>

        <details class="raw-output-details">
            <summary>🔄 tmux raw出力（折りたたみ）<span id="shogun-ws-status" class="ws-status ws-status-connecting">接続中...</span>
            <button id="reconnect-shogun-btn" class="reconnect-shogun-btn reconnect-btn-hidden">再接続</button></summary>
            <div id="shogun-output" class="terminal"><pre>接続中...</pre></div>
        </details>
    </div>

    <!-- タブ2: 監視 -->
    <div id="tab-monitor" class="tab-content">
        <section class="monitor-section">
        <h2>👁️ 全ペイン監視</h2>
        <div class="monitor-controls">
            <button id="clear-monitor-btn" class="clear-monitor-btn">🧹 表示クリア</button>
            <button id="reconnect-monitor-btn" class="reconnect-monitor-btn reconnect-btn-hidden">再接続</button>
            <span id="monitor-ws-status" class="ws-status ws-status-connecting">接続中...</span>
        </div>
        <div id="monitor-grid" class="monitor-grid">
            <!-- WebSocketで動的に生成 -->
            <div class="monitor-loading">接続中...</div>
        </div>
        </section>
    </div>

    <!-- タブ3: 戦況 -->
    <div class="tab-content" id="tab-dashboard">
        <section class="dashboard">
            <h2>📊 ダッシュボード</h2>
            <div class="dashboard-controls">
                <button type="button" id="dashboard-refresh-btn" class="dashboard-refresh-btn" hx-disable>更新</button>
                <button type="button" id="dashboard-mode-toggle" class="dashboard-mode-btn" data-mode="rendered" hx-disable>📋 Rendered</button>
            </div>
            <div id="dashboard-content">
                読み込み待ち...
            </div>
        </section>
    </div>

    <!-- タブ3: 履歴 -->
    <div class="tab-content" id="tab-history">
        <section class="command-history">
            <h2>📜 コマンド履歴</h2>
            {% include "partials/history.html" %}
        </section>
    </div>
</div>

<!-- スクロールボタン（全タブ共通・固定表示） -->
<div class="scroll-buttons" id="scroll-buttons">
    <button type="button" class="scroll-btn" id="scroll-top-btn" title="一番上へ" aria-label="一番上へスクロール" hx-disable>&#9650;</button>
    <button type="button" class="scroll-btn" id="scroll-bottom-btn" title="一番下へ" aria-label="一番下へスクロール" hx-disable>&#9660;</button>
</div>

<style>
/* 会話ログUI */
#chat-log {
    max-height: 70vh;
    overflow-y: auto;
    padding: 10px;
    background: rgba(0,0,0,.05);
    border-radius: 8px;
}
.msg {
    padding: 8px 10px;
    border-radius: 10px;
    margin: 6px 0;
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 14px;
}
.msg.user {
    background: rgba(80,160,255,.15);
    border: 1px solid rgba(80,160,255,.35);
}
.msg.shogun {
    background: rgba(255,220,80,.12);
    border: 1px solid rgba(255,220,80,.30);
}
.msg.system {
    opacity: .75;
    font-style: italic;
}

/* クリアボタン */
.clear-monitor-btn {
    margin: 0;
    padding: 8px 16px;
    background: rgba(255,100,100,0.1);
    border: 1px solid rgba(255,100,100,0.3);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    transition: all 0.2s;
}
.clear-monitor-btn:hover {
    background: rgba(255,100,100,0.2);
    border-color: rgba(255,100,100,0.5);
}
</style>

<script>
// ユーザー入力マーカー定数
const USER_INPUT_MARKER = '\x1f';

// HTMLエスケープ関数（XSS対策）
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// マーカーベースの色分け関数
function colorizeOutput(text, color) {
    return text.split('\n').map(line => {
        if (line.startsWith(USER_INPUT_MARKER)) {
            // マーカー付き行 = ユーザー入力行
            const content = line.substring(1);  // マーカーを除去
            return '<span style="color: ' + color + '">' + escapeHtml(content) + '</span>';
        }
        return escapeHtml(line);
    }).join('\n');
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        // 履歴タブ: 自動更新しない（手動の「🔄 更新」ボタンで更新）
    });
});

// Ctrl+Enter で送信
document.querySelector('textarea[name="instruction"]').addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        e.target.closest('form').requestSubmit();
    }
});

// Esc キー送信関数
function sendEscapeKey() {
    if (!confirm('Escキーを将軍に送信しますか？')) {
        return;
    }
    fetch('{{ base_path }}/api/special-key', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({key: 'Escape'})
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'sent') {
            document.getElementById('command-result').innerHTML = '<p style="color:green;">Escキーを送信しました</p>';
        } else {
            document.getElementById('command-result').innerHTML = '<p style="color:red;">送信失敗: ' + (data.message || 'Unknown error') + '</p>';
        }
    })
    .catch(err => {
        document.getElementById('command-result').innerHTML = '<p style="color:red;">送信エラー: ' + err + '</p>';
    });
}

// Esc ボタンクリック
document.getElementById('esc-btn').addEventListener('click', sendEscapeKey);

// ブラウザでEscキー押下時
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        e.preventDefault();
        sendEscapeKey();
    }
});

// TUI操作パネル: 汎用キー送信関数
function sendTuiKey(key) {
    fetch('{{ base_path }}/api/special-key', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({key: key})
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'sent') {
            document.getElementById('command-result').innerHTML = '<p style="color:green;">キー「' + key + '」を送信しました</p>';
        } else {
            document.getElementById('command-result').innerHTML = '<p style="color:red;">送信失敗: ' + (data.message || 'Unknown error') + '</p>';
        }
    })
    .catch(err => {
        document.getElementById('command-result').innerHTML = '<p style="color:red;">送信エラー: ' + err + '</p>';
    });
}

// TUI操作パネル: 折り畳み機能
document.getElementById('tui-panel-toggle').addEventListener('click', (e) => {
    const grid = document.getElementById('tui-grid');
    const icon = document.getElementById('tui-toggle-icon');
    if (grid.style.display === 'none') {
        grid.style.display = 'grid';
        icon.textContent = '▼';
    } else {
        grid.style.display = 'none';
        icon.textContent = '▶';
    }
});

// TUI操作パネル: 長押し確認機能（決定系ボタン）
const HOLD_DURATION = 1000; // 1秒
const holdTimers = new Map();

document.querySelectorAll('.tui-key').forEach(btn => {
    const key = btn.getAttribute('data-key');
    if (!key) return;

    const isCritical = btn.classList.contains('tui-key-critical');

    if (isCritical) {
        // 決定系ボタン: 長押し（1秒）で発動
        let pressStartTime = 0;
        let holdTimer = null;
        const progressBar = btn.querySelector('.progress-bar');

        btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            pressStartTime = Date.now();
            btn.classList.add('holding');

            holdTimer = setTimeout(() => {
                sendTuiKey(key);
                btn.classList.remove('holding');
                btn.classList.add('activated');
                setTimeout(() => btn.classList.remove('activated'), 300);
            }, HOLD_DURATION);
        });

        btn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
            btn.classList.remove('holding');
        });

        btn.addEventListener('mouseleave', (e) => {
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
            btn.classList.remove('holding');
        });

        // タッチデバイス対応
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pressStartTime = Date.now();
            btn.classList.add('holding');

            holdTimer = setTimeout(() => {
                sendTuiKey(key);
                btn.classList.remove('holding');
                btn.classList.add('activated');
                setTimeout(() => btn.classList.remove('activated'), 300);
            }, HOLD_DURATION);
        });

        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
            btn.classList.remove('holding');
        });
    } else {
        // 通常ボタン: 即座に発動
        btn.addEventListener('click', (e) => {
            sendTuiKey(key);
        });
    }
});

// 履歴タブ: トグルボタンの開閉制御（イベント委譲）
document.addEventListener('click', (e) => {
    if (e.target.classList.contains('toggle-btn')) {
        const content = e.target.nextElementSibling;
        if (content.style.display === 'none') {
            content.style.display = 'block';
            e.target.textContent = '▼ 非表示';
        } else {
            content.style.display = 'none';
            e.target.textContent = '▶ 表示';
        }
    }
    if (e.target.dataset && e.target.dataset.action === 'open-all') {
        document.querySelectorAll('.instruction-content').forEach(c => c.style.display = 'block');
        document.querySelectorAll('.toggle-btn').forEach(b => b.textContent = '▼ 非表示');
    }
    if (e.target.dataset && e.target.dataset.action === 'close-all') {
        document.querySelectorAll('.instruction-content').forEach(c => c.style.display = 'none');
        document.querySelectorAll('.toggle-btn').forEach(b => b.textContent = '▶ 表示');
    }
});

// 会話ログ関連変数
const MAX_CHAT_LOG_MESSAGES = 200;

// 会話ログにメッセージを追加する関数
function addChatMessage(text, className) {
    const chatLog = document.getElementById('chat-log');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg ' + className;
    msgDiv.textContent = text;
    chatLog.appendChild(msgDiv);

    // 上限管理：古いメッセージを削除
    while (chatLog.children.length > MAX_CHAT_LOG_MESSAGES) {
        chatLog.removeChild(chatLog.firstChild);
    }

    chatLog.scrollTop = chatLog.scrollHeight;
}

// raw出力を全置換する関数
function updateRawOutput(text) {
    const el = document.getElementById('shogun-output');
    el.innerHTML = '<pre>' + colorizeOutput(text, 'lightblue') + '</pre>';
}

// raw出力に追記する関数
function appendToRawOutput(text) {
    const el = document.getElementById('shogun-output');
    const pre = el.querySelector('pre');
    if (pre) {
        // 既存コンテンツに追記
        const currentHtml = pre.innerHTML;
        pre.innerHTML = currentHtml + '\n' + colorizeOutput(text, 'lightblue');
    } else {
        // preタグがない場合は新規作成
        el.innerHTML = '<pre>' + colorizeOutput(text, 'lightblue') + '</pre>';
    }
}

// htmx afterRequest イベントで送信成功時に会話ログに追加
document.body.addEventListener('htmx:afterRequest', (e) => {
    if (e.detail.pathInfo.requestPath === '/api/command' && e.detail.successful) {
        const form = e.target;
        const textarea = form.querySelector('textarea[name="instruction"]');
        if (textarea && textarea.value.trim()) {
            addChatMessage(textarea.value.trim(), 'user');
        }
    }
});

// ペンディングファイルをフォーム送信後に送る
function onCommandSuccess() {
    if (pendingFiles.length > 0) {
        const filesToSend = pendingFiles.slice();
        clearAllFileChips();
        filesToSend.forEach(function(f) { sendFileToShogun(f); });
    }
}

// ===========================================================
// ReconnectingWebSocket: 殿の最終確定仕様準拠
// - onclose のみによる切断判定（A方式）
// - リトライ上限3回、エクスポネンシャルバックオフ(1s->30s)
// - UI表示遅延による瞬断非表示
// - 閾値は全て /api/ws-config から取得（ハードコード禁止）
// ===========================================================
class ReconnectingWebSocket {
    constructor(url, opts = {}) {
        this.url = url;
        this.onmessage = opts.onmessage || null;
        this.onstatuschange = opts.onstatuschange || null;
        this._baseDelay = opts.baseDelay || 1000;
        this._maxDelay = opts.maxDelay || 30000;
        this._maxRetries = opts.maxRetries || 3;
        this._uiDelayMs = opts.uiDelayMs || 0;          // UI表示遅延閾値
        this._currentDelay = this._baseDelay;
        this._retryCount = 0;
        this._reconnectTimer = null;
        this._uiDelayTimer = null;
        this._ws = null;
        this._intentionalClose = false;
        this._internalState = 'connecting';  // 内部状態
        this._statusElementId = opts.statusElementId || null;
        this._reconnectBtnId = opts.reconnectBtnId || null;
        this.connect();
    }

    connect() {
        this._clearReconnectTimer();
        // 既存のWebSocketがあれば閉じる
        if (this._ws) {
            this._intentionalClose = true;
            try { this._ws.close(); } catch (e) { /* ignore */ }
            this._ws = null;
        }
        this._intentionalClose = false;
        this._internalState = 'connecting';
        this._updateUI('connecting');
        try {
            this._ws = new WebSocket(this.url);
        } catch (err) {
            this._handleDisconnect();
            return;
        }

        this._ws.onopen = () => {
            this._currentDelay = this._baseDelay;
            this._retryCount = 0;
            this._internalState = 'connected';
            // 瞬断中のUI遅延タイマーをキャンセル（瞬断をUI上完全無視）
            this._clearUiDelayTimer();
            this._updateUI('connected');
            this._hideReconnectBtn();
        };

        this._ws.onmessage = (e) => {
            if (this.onmessage) this.onmessage(e);
        };

        this._ws.onclose = () => {
            // onclose による切断判定（A方式のみ）
            if (!this._intentionalClose) {
                this._handleDisconnect();
            }
        };
    }

    reconnect() {
        // 手動再接続: リトライカウントリセット
        this._clearReconnectTimer();
        this._clearUiDelayTimer();
        this._retryCount = 0;
        this._currentDelay = this._baseDelay;
        if (this._ws) {
            this._intentionalClose = true;
            try { this._ws.close(); } catch (e) { /* ignore */ }
            this._ws = null;
        }
        this.connect();
    }

    _handleDisconnect() {
        this._internalState = 'disconnected';

        // リトライ上限チェック
        if (this._retryCount >= this._maxRetries) {
            // リトライ上限到達: 自動再接続停止
            this._clearUiDelayTimer();
            this._updateUI('failed');
            this._showReconnectBtn();
            return;
        }

        // UI表示: 閾値時間経過後のみ「切断」表示（瞬断は無視）
        this._startUiDelayTimer();

        // 自動再接続スケジュール
        this._scheduleReconnect();
    }

    _scheduleReconnect() {
        this._clearReconnectTimer();
        this._retryCount++;
        const delay = this._currentDelay;
        this._reconnectTimer = setTimeout(() => {
            this._currentDelay = Math.min(this._currentDelay * 2, this._maxDelay);
            // 再接続試行中はUI更新
            this._clearUiDelayTimer();
            this._updateUI('reconnecting');
            this.connect();
        }, delay);
    }

    _startUiDelayTimer() {
        this._clearUiDelayTimer();
        if (this._uiDelayMs > 0) {
            this._uiDelayTimer = setTimeout(() => {
                this._uiDelayTimer = null;
                // 閾値経過後もまだ切断状態なら「切断」表示
                if (this._internalState === 'disconnected') {
                    this._updateUI('disconnected');
                }
            }, this._uiDelayMs);
        } else {
            // uiDelayMs=0 の場合は即座に表示
            this._updateUI('disconnected');
        }
    }

    _clearReconnectTimer() {
        if (this._reconnectTimer) {
            clearTimeout(this._reconnectTimer);
            this._reconnectTimer = null;
        }
    }

    _clearUiDelayTimer() {
        if (this._uiDelayTimer) {
            clearTimeout(this._uiDelayTimer);
            this._uiDelayTimer = null;
        }
    }

    _updateUI(displayStatus) {
        const el = this._statusElementId ? document.getElementById(this._statusElementId) : null;
        if (!el) return;

        el.className = 'ws-status';
        switch (displayStatus) {
            case 'connecting':
                el.className += ' ws-status-connecting';
                el.textContent = '接続中...';
                break;
            case 'connected':
                el.className += ' ws-status-connected';
                el.textContent = '';
                break;
            case 'disconnected':
                el.className += ' ws-status-disconnected';
                el.textContent = '切断';
                break;
            case 'reconnecting':
                el.className += ' ws-status-reconnecting';
                el.textContent = '再接続中...';
                break;
            case 'failed':
                el.className += ' ws-status-failed';
                el.textContent = '接続が切断されました';
                break;
        }

        if (this.onstatuschange) {
            this.onstatuschange(displayStatus);
        }
    }

    _showReconnectBtn() {
        const btn = this._reconnectBtnId ? document.getElementById(this._reconnectBtnId) : null;
        if (btn) btn.classList.remove('reconnect-btn-hidden');
    }

    _hideReconnectBtn() {
        const btn = this._reconnectBtnId ? document.getElementById(this._reconnectBtnId) : null;
        if (btn) btn.classList.add('reconnect-btn-hidden');
    }

    get readyState() {
        return this._ws ? this._ws.readyState : WebSocket.CLOSED;
    }
}

// ===========================================================
// WebSocket初期化: /api/ws-config から設定取得後に接続開始
// ===========================================================
const monitorPanes = {}; // ペイン出力のローカルキャッシュ（行配列）
let shogunWs = null;
let monitorWs = null;

(async function initWebSockets() {
    // 設定値取得（全閾値はsettings.yamlから算出、ハードコード禁止）
    let wsConfig;
    try {
        const res = await fetch('{{ base_path }}/api/ws-config');
        wsConfig = await res.json();
    } catch (e) {
        // フォールバック: API失敗時はデフォルト値（settings.yamlのデフォルトと同じ）
        wsConfig = {
            monitor: { base_interval_ms: 5000, max_interval_ms: 10000 },
            shogun: { base_interval_ms: 1000, max_interval_ms: 3000 }
        };
    }

    // 閾値算出（settings.yamlから取得、ハードコード禁止）
    // 指揮タブ(shogun): uiDelay = max_interval_ms（瞬断無視の閾値）
    const shogunUiDelayMs = wsConfig.shogun.max_interval_ms;

    // 監視タブ(monitor): uiDelay = base_interval_ms（瞬断無視の閾値）
    const monitorUiDelayMs = wsConfig.monitor.base_interval_ms;

    // WebSocket URL構築: プロトコル自動検出 + base_path対応
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const basePath = '{{ base_path }}';
    const shogunWsUrl = wsProtocol + '//' + location.host + basePath + '/ws';
    const monitorWsUrl = wsProtocol + '//' + location.host + basePath + '/ws/monitor';

    // 指揮タブ WebSocket
    shogunWs = new ReconnectingWebSocket(shogunWsUrl, {
        uiDelayMs: shogunUiDelayMs,
        maxRetries: 3,
        statusElementId: 'shogun-ws-status',
        reconnectBtnId: 'reconnect-shogun-btn',
        onmessage: (e) => {
            const data = JSON.parse(e.data);
            const el = document.getElementById('shogun-output');
            const wasAtBottom = el.scrollHeight - el.scrollTop <= el.clientHeight + 50;

            if (data.type === 'noop') {
                return;
            }

            if (data.type === 'reset') {
                const fullText = data.lines.join('\n');
                updateRawOutput(fullText);
                if (fullText.trim()) {
                    addChatMessage(fullText.trim(), 'shogun');
                }
                if (wasAtBottom) {
                    el.scrollTop = el.scrollHeight;
                }
                return;
            }

            if (data.type === 'delta') {
                const newText = data.lines.join('\n');
                if (newText.trim()) {
                    appendToRawOutput(newText);
                    addChatMessage(newText.trim(), 'shogun');
                }
                if (wasAtBottom) {
                    el.scrollTop = el.scrollHeight;
                }
                return;
            }

            if (data.output !== undefined) {
                let output = data.output;
                if (output.length > 10000) {
                    output = output.slice(-10000);
                }
                updateRawOutput(output);
                if (output.trim()) {
                    addChatMessage(output.trim(), 'shogun');
                }
                if (wasAtBottom) {
                    el.scrollTop = el.scrollHeight;
                }
            }
        },
        onstatuschange: (status) => {
            // 切断時: 既存コンテンツは保持（白画面にしない）
        }
    });

    // 監視タブ WebSocket
    monitorWs = new ReconnectingWebSocket(monitorWsUrl, {
        uiDelayMs: monitorUiDelayMs,
        maxRetries: 3,
        statusElementId: 'monitor-ws-status',
        reconnectBtnId: 'reconnect-monitor-btn',
        onmessage: (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'monitor_update' && data.updates) {
                Object.entries(data.updates).forEach(([paneId, deltaResult]) => {
                    if (deltaResult.type === 'reset') {
                        monitorPanes[paneId] = deltaResult.lines;
                    } else if (deltaResult.type === 'delta') {
                        if (!monitorPanes[paneId]) {
                            monitorPanes[paneId] = [];
                        }
                        monitorPanes[paneId].push(...deltaResult.lines);
                        if (monitorPanes[paneId].length > 5000) {
                            monitorPanes[paneId] = monitorPanes[paneId].slice(-5000);
                        }
                    }
                });
                renderMonitorPanes(monitorPanes);
                return;
            }

            if (data.updates) {
                Object.entries(data.updates).forEach(([paneId, output]) => {
                    if (typeof output === 'string') {
                        let processedOutput = output;
                        if (output.length > 10000) {
                            processedOutput = output.slice(-10000);
                        }
                        monitorPanes[paneId] = processedOutput.split('\n');
                    }
                });
                renderMonitorPanes(monitorPanes);
            }
        },
        onstatuschange: (status) => {
            // 切断時: monitorPanes キャッシュを保持し、既存カードをそのまま表示
        }
    });

    // 再接続ボタン: 手動再接続
    document.getElementById('reconnect-shogun-btn').addEventListener('click', () => {
        if (shogunWs) shogunWs.reconnect();
    });

    document.getElementById('reconnect-monitor-btn').addEventListener('click', () => {
        if (monitorWs) monitorWs.reconnect();
    });
})();

// ペイン描画関数（delta 対応: 行配列をレンダリング）
function renderMonitorPanes(panes) {
    const grid = document.getElementById('monitor-grid');
    if (!grid) return;

    // ペインIDでソートして安定した表示順を維持
    const sortedPaneIds = Object.keys(panes).sort((a, b) => {
        const numA = parseInt(a.replace(/\D/g, ''), 10) || 0;
        const numB = parseInt(b.replace(/\D/g, ''), 10) || 0;
        return numA - numB;
    });

    grid.innerHTML = sortedPaneIds.map(paneId => {
        const lines = panes[paneId];
        // 行配列を文字列に変換
        const output = Array.isArray(lines) ? lines.join('\n') : lines;
        // colorizeOutput でマーカー付き行をライトブルーに色分け
        const colorizedOutput = colorizeOutput(output, 'lightblue');
        return `
            <div class="pane-card" data-pane-id="${paneId}">
                <div class="pane-header">${paneId}</div>
                <div class="pane-output"><pre>${colorizedOutput}</pre></div>
            </div>
        `;
    }).join('');

    // 各カードの自動スクロール
    grid.querySelectorAll('.pane-output').forEach(el => {
        el.scrollTop = el.scrollHeight;
    });
}

// スクロールボタン: 一番上/一番下へスムーススクロール
document.getElementById('scroll-top-btn').addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('scroll-bottom-btn').addEventListener('click', () => {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
});

// ===========================================================
// ダッシュボード: Markdown整形表示トグル
// ===========================================================
let dashboardMode = 'rendered'; // デフォルト: Rendered モード

function applyDashboardMode() {
    const rawDataEl = document.getElementById('dashboard-raw-data');
    const displayEl = document.getElementById('dashboard-display');
    if (!rawDataEl || !displayEl) return;

    const rawText = rawDataEl.textContent;

    if (dashboardMode === 'rendered') {
        // marked.js でパースして整形HTML表示
        displayEl.className = 'markdown-body';
        displayEl.innerHTML = marked.parse(rawText);
    } else {
        // 生テキスト表示
        displayEl.className = '';
        const pre = document.createElement('pre');
        pre.textContent = rawText;
        displayEl.innerHTML = '';
        displayEl.appendChild(pre);
    }
}

// トグルボタン
document.getElementById('dashboard-mode-toggle').addEventListener('click', () => {
    const btn = document.getElementById('dashboard-mode-toggle');
    if (dashboardMode === 'rendered') {
        dashboardMode = 'raw';
        btn.textContent = '📄 Raw';
        btn.dataset.mode = 'raw';
    } else {
        dashboardMode = 'rendered';
        btn.textContent = '📋 Rendered';
        btn.dataset.mode = 'rendered';
    }
    applyDashboardMode();
});

// ダッシュボード手動更新: fetchして表示を更新
function refreshDashboard() {
    const btn = document.getElementById('dashboard-refresh-btn');
    btn.disabled = true;
    btn.textContent = '更新中...';

    fetch('{{ base_path }}/api/dashboard')
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(html => {
            document.getElementById('dashboard-content').innerHTML = html;
            applyDashboardMode();
        })
        .catch(err => {
            document.getElementById('dashboard-content').innerHTML =
                '<pre>Error: ' + escapeHtml(String(err)) + '</pre>';
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = '更新';
        });
}

// 更新ボタンクリック
document.getElementById('dashboard-refresh-btn').addEventListener('click', refreshDashboard);

// 初回表示: ダッシュボードタブが表示されたら一度だけfetch
let dashboardInitialLoaded = false;
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if (btn.dataset.tab === 'dashboard' && !dashboardInitialLoaded) {
            dashboardInitialLoaded = true;
            refreshDashboard();
        }
    });
});

// クリアボタン: 全ペインの表示履歴を消去（バックエンドスナップショット方式）
document.getElementById('clear-monitor-btn').addEventListener('click', () => {
    fetch('{{ base_path }}/api/monitor/clear', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'}
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'cleared') {
            // バックエンドがスナップショット保存完了
            // ローカルキャッシュをクリア
            Object.keys(monitorPanes).forEach(key => {
                monitorPanes[key] = [];
            });
            renderMonitorPanes(monitorPanes);
        } else {
            console.error('Clear failed:', data.message);
        }
    })
    .catch(err => {
        console.error('Clear error:', err);
    });
});

// ===========================================================
// ファイル添付機能: 📎ボタン / Ctrl+V / ドラッグ&ドロップ → /api/file-paste
// ===========================================================
const IMAGE_RESIZE_THRESHOLD = 5 * 1024 * 1024;
const IMAGE_MAX_DIMENSION = 2048;

let pendingFiles = [];

function renderFileChips() {
    const container = document.getElementById('file-chips-container');
    if (!container) return;
    if (pendingFiles.length === 0) { container.style.display = 'none'; container.innerHTML = ''; return; }
    container.style.display = 'flex';
    container.innerHTML = '';
    pendingFiles.forEach(function(file, i) {
        const chip = document.createElement('div');
        chip.style.cssText = 'display:flex; align-items:center; gap:4px; padding:2px 6px; background:#f0f0f0; border:1px solid #ccc; border-radius:4px; font-size:12px; color:#333; max-width:200px;';
        const icon = document.createElement('span'); icon.textContent = '📎'; icon.style.cssText = 'font-size:11px; flex-shrink:0;';
        const name = document.createElement('span'); name.textContent = file.name || '（名前なし）'; name.style.cssText = 'flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
        const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = '×'; btn.title = '添付を解除';
        btn.style.cssText = 'background:none; border:none; cursor:pointer; color:#666; font-size:13px; padding:0 1px; flex-shrink:0; line-height:1;';
        btn.addEventListener('click', (function(idx) { return function() { removeFileChip(idx); }; })(i));
        chip.appendChild(icon); chip.appendChild(name); chip.appendChild(btn);
        container.appendChild(chip);
    });
}
function addFileChip(file) { pendingFiles.push(file); renderFileChips(); }
function removeFileChip(index) { pendingFiles.splice(index, 1); renderFileChips(); }
function clearAllFileChips() { pendingFiles = []; renderFileChips(); }

function showFileStatus(msg, isError) {
    const el = document.getElementById('file-paste-status');
    if (!el) return;
    el.textContent = msg; el.style.color = isError ? '#c0392b' : '#27ae60'; el.style.display = 'block';
    if (!isError) setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function resizeImageIfNeeded(file) {
    return new Promise(function(resolve) {
        if (file.size <= IMAGE_RESIZE_THRESHOLD) { resolve(file); return; }
        const canvas = document.createElement('canvas');
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = function() {
            let w = img.width, h = img.height;
            if (w > IMAGE_MAX_DIMENSION || h > IMAGE_MAX_DIMENSION) {
                const ratio = Math.min(IMAGE_MAX_DIMENSION / w, IMAGE_MAX_DIMENSION / h);
                w = Math.round(w * ratio); h = Math.round(h * ratio);
            }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            canvas.toBlob(function(blob) {
                resolve(blob ? new File([blob], file.name.replace(/\.[^.]+$/, '.jpeg'), {type: 'image/jpeg'}) : file);
            }, 'image/jpeg', 0.85);
        };
        img.onerror = function() { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
    });
}

function sendFileToShogun(file) {
    if (!file) return;
    showFileStatus('📤 ファイルを送信中...', false);
    const isImage = file.type.startsWith('image/');
    const processAndSend = function(fileToSend) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const dataUrl = e.target.result;
            const comma = dataUrl.indexOf(',');
            if (comma === -1) { showFileStatus('❌ ファイルデータの変換に失敗しました', true); return; }
            const file_b64 = dataUrl.substring(comma + 1);
            fetch('{{ base_path }}/api/file-paste', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    file_b64: file_b64,
                    file_name: fileToSend.name || file.name || 'file.bin',
                    mime_type: fileToSend.type || file.type || 'application/octet-stream',
                    message_prefix: ''
                })
            })
            .then(res => { if (!res.ok) return res.text().then(t => { throw new Error(t || 'HTTP ' + res.status); }); return res.json(); })
            .then(data => { const fp = data.file_path ? ' → ' + data.file_path.split('/').pop() : ''; showFileStatus('✅ ファイルを将軍に送信しました' + fp, false); })
            .catch(err => { showFileStatus('❌ 送信失敗: ' + err.message, true); });
        };
        reader.onerror = function() { showFileStatus('❌ ファイルの読み取りに失敗しました', true); };
        reader.readAsDataURL(fileToSend);
    };
    if (isImage) { resizeImageIfNeeded(file).then(processAndSend); } else { processAndSend(file); }
}

// pasteイベント: クリップボードから画像を取得
document.addEventListener('paste', function(e) {
    const items = e.clipboardData && e.clipboardData.items;
    if (items) {
        for (let i = 0; i < items.length; i++) {
            if (items[i].kind === 'file' && items[i].type.startsWith('image/')) {
                const file = items[i].getAsFile();
                if (file) { e.preventDefault(); addFileChip(file); return; }
            }
        }
    }
});

// 📎ボタン: クリックでファイル選択
(function() {
    const btn = document.getElementById('file-attach-btn');
    if (!btn) return;
    btn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = '*/*'; input.multiple = true;
        input.onchange = (e) => { const files = e.target.files; if (files) for (let i = 0; i < files.length; i++) addFileChip(files[i]); };
        input.click();
    });
})();

// ドラッグ&ドロップ
(function() {
    const section = document.querySelector('.command-input');
    const overlay = document.getElementById('file-drop-overlay');
    if (!section || !overlay) return;
    let dragCount = 0;
    section.addEventListener('dragenter', (e) => { e.preventDefault(); dragCount++; overlay.style.display = 'block'; });
    section.addEventListener('dragleave', () => { dragCount--; if (dragCount <= 0) { dragCount = 0; overlay.style.display = 'none'; } });
    section.addEventListener('dragover', (e) => { e.preventDefault(); });
    overlay.addEventListener('drop', (e) => {
        e.preventDefault(); dragCount = 0; overlay.style.display = 'none';
        const files = e.dataTransfer && e.dataTransfer.files;
        if (files) for (let i = 0; i < files.length; i++) addFileChip(files[i]);
    });
})();
